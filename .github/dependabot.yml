version: 2
updates:
  # Keep the SHA-pinned workflow actions current. Dependabot rewrites both the
  # SHA and the trailing version comment when a new release lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Composer dependencies (runtime and dev). Minor and patch bumps are grouped
  # into a single PR to keep the noise down; majors open on their own.
  #
  # Security updates are a separate Dependabot flow and the version-update
  # groups do not cover them. Without an `applies-to: security-updates` group,
  # every advisory opens its own PR, each rewriting the same lockfile and
  # conflicting with the others. Each ecosystem below has one.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
      composer-security:
        applies-to: security-updates
        patterns:
          - '*'

  # The Astro documentation website has its own lockfile.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website-minor-patch:
        update-types:
          - minor
          - patch
      website-security:
        applies-to: security-updates
        patterns:
          - '*'
