name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        filament: ['4', '5']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP 8.3+, so it cannot run on the 8.2 leg.
          - php: '8.2'
            laravel: '13.*'
          # Laravel 11 predates PHP 8.5 and emits framework-level deprecations
          # there. Exercise 8.5 against the current Laravel lines (12 and 13).
          - php: '8.5'
            laravel: '11.*'
          # PHP 8.2 resolves Pest 3, whose Livewire plugin requires Livewire 3, while
          # Filament 5 requires Livewire 4. The package still allows this combination;
          # only the test stack cannot install it.
          - php: '8.2'
            filament: '5'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Filament ${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: pcov
          # Every current Laravel 11 release is flagged by a security advisory, which
          # composer's insecure-package block would reject. We disable that block via
          # config.audit.block-insecure in composer.json (the 2.9 key), so pin to 2.9 to
          # keep that key honored. Revisit once the advisory range is patched upstream.
          tools: composer:2.9

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "filament/filament:^${{ matrix.filament }}.0" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  # "Coverage" is a required status check on main, so keep the name. Coverage
  # measures the package's own code; pin it to Filament 5 so it never floats
  # between majors. The test matrix above runs the suite on both.
  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: pcov
          # See the test job: pin to 2.9 so config.audit.block-insecure is honored.
          tools: composer:2.9

      - name: Install dependencies
        run: |
          composer require "filament/filament:^5.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Enforce coverage threshold
        run: composer test-coverage
