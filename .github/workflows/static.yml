name: static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # "PHPStan and Pint" is a required status check on main, so keep the name.
  # It analyses against Filament 5; the job below covers Filament 4.
  static:
    runs-on: ubuntu-latest
    name: PHPStan and Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
          # See tests.yml: pin to 2.9 so config.audit.block-insecure (which lets the flagged
          # Laravel 11 releases install) is honored.
          tools: composer:2.9

      - name: Install dependencies
        run: |
          composer require "filament/filament:^5.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer analyse

      - name: Check formatting with Pint
        run: vendor/bin/pint --test

  static-filament-4:
    runs-on: ubuntu-latest
    name: PHPStan (Filament 4)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
          # See tests.yml: pin to 2.9 so config.audit.block-insecure (which lets the flagged
          # Laravel 11 releases install) is honored.
          tools: composer:2.9

      - name: Install dependencies
        run: |
          composer require "filament/filament:^4.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer analyse
